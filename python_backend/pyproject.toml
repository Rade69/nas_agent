[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rileyjarvis-python-backend"
version = "0.1.0"
description = "Python backend skeleton for RileyJarvis Windows Hybrid."
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic",
  "python-dotenv",
  "pytest",
  "httpx",
  "uiautomation",
  # FAZA S-1: runtime enforcement of each tool's input_schema (was already
  # present transitively; declared explicitly so it is not an accidental dep).
  "jsonschema",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
